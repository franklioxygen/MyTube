name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    
    strategy:
      matrix:
        node-version: [22.22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm run install:all
      
    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint

    - name: Typecheck Frontend
      run: |
        cd frontend
        npm run typecheck

    - name: Build Frontend
      run: |
        cd frontend
        npm run build
        
    - name: Build Backend
      run: |
        cd backend
        npm run build
        
    - name: Test Backend
      run: |
        cd backend
        npm run test

    - name: Generate Coverage Reports
      if: ${{ env.CODACY_API_TOKEN != '' || env.CODACY_PROJECT_TOKEN != '' }}
      run: |
        cd backend
        npm run test:coverage -- --coverage.reporter=lcov

        cd ../frontend
        npm run test:coverage -- --coverage.reporter=lcov

    - name: Upload Coverage Reports to Codacy
      if: ${{ env.CODACY_API_TOKEN != '' || env.CODACY_PROJECT_TOKEN != '' }}
      run: |
        set -euo pipefail

        CODACY_TOKEN="${CODACY_API_TOKEN:-$CODACY_PROJECT_TOKEN}"
        REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"
        REPO_NAME="${GITHUB_REPOSITORY#*/}"

        if curl --silent --show-error --fail -H "api-token: ${CODACY_TOKEN}" https://api.codacy.com/api/v3/user > /dev/null; then
          echo "Using Codacy account token mode."
          export CODACY_API_TOKEN="${CODACY_TOKEN}"
          export CODACY_ORGANIZATION_PROVIDER="gh"
          export CODACY_USERNAME="${REPO_OWNER}"
          export CODACY_PROJECT_NAME="${REPO_NAME}"
          unset CODACY_PROJECT_TOKEN
        else
          echo "Using Codacy project token mode."
          export CODACY_PROJECT_TOKEN="${CODACY_TOKEN}"
          unset CODACY_API_TOKEN CODACY_ORGANIZATION_PROVIDER CODACY_USERNAME CODACY_PROJECT_NAME
        fi

        bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
          --partial \
          --force-coverage-parser lcov \
          --prefix backend/ \
          -r backend/coverage/lcov.info

        bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
          --partial \
          --force-coverage-parser lcov \
          --prefix frontend/ \
          -r frontend/coverage/lcov.info

        bash <(curl -Ls https://coverage.codacy.com/get.sh) final

  # The managed yt-dlp release store publishes by atomic rename and builds an
  # explicit `<python> -m yt_dlp` command line. Both behave differently on
  # Windows (MoveFileEx replace semantics, sharing violations from an open
  # reader, `;` as the PYTHONPATH delimiter), so this subset runs on all three
  # platforms. The full backend suite stays on Linux only.
  ytdlp-release-store:
    name: yt-dlp release store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # This subset never touches media tooling, Chromium, or the POT provider.
      SKIP_FFMPEG_AUTO_INSTALL: '1'
      SKIP_PROVIDER_BUILD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.22.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Dependencies
      working-directory: backend
      run: npm ci

    - name: Test yt-dlp Release Store
      working-directory: backend
      run: >-
        npx vitest run
        src/__tests__/utils/ytdlpManagedRelease.test.ts
        src/__tests__/utils/ytdlpReleaseConcurrency.test.ts
        src/__tests__/utils/ytdlpReleaseFailureInjection.test.ts
        src/__tests__/utils/ytdlpReleaseIntegration.test.ts
        src/__tests__/utils/ytdlpReleaseValidation.test.ts
        src/__tests__/utils/ytdlpSpawnBoundary.test.ts
